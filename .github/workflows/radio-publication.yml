name: Radio publication

on:
  schedule:
    # GitHub cron is UTC. Each Pacific stage has PDT and PST candidates;
    # the Choose stage guard runs only the candidate matching local Pacific time.
    - cron: "0 10 * * *"  # 03:00 PDT primary collection
    - cron: "0 11 * * *"  # 03:00 PST primary collection
    - cron: "15 10 * * *" # 03:15 PDT episode preparation
    - cron: "15 11 * * *" # 03:15 PST episode preparation
    - cron: "30 10 * * *" # 03:30 PDT validated publication
    - cron: "30 11 * * *" # 03:30 PST validated publication
  workflow_dispatch:
    inputs:
      stage:
        description: Pipeline stage
        required: true
        default: all
        type: choice
        options: [primary, refresh, publish, all]

permissions:
  contents: write

concurrency:
  group: sharecapsule-radio-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RADIO_MODE: ${{ vars.RADIO_MODE || 'mock' }}
      PUBLICATION_BASE_URL: https://radio.sharecapsule.app
      MARKET_DATA_URL: ${{ vars.MARKET_DATA_URL }}
      NEWS_FEED_URL: ${{ vars.NEWS_FEED_URL }}
      MARKET_DATA_TOKEN: ${{ secrets.MARKET_DATA_TOKEN }}
      NEWS_FEED_TOKEN: ${{ secrets.NEWS_FEED_TOKEN }}
      SCRIPT_GENERATOR_URL: ${{ vars.SCRIPT_GENERATOR_URL }}
      SCRIPT_GENERATOR_TOKEN: ${{ secrets.SCRIPT_GENERATOR_TOKEN }}
      TTS_URL: ${{ vars.TTS_URL }}
      TTS_TOKEN: ${{ secrets.TTS_TOKEN }}
      AUDIO_PUBLIC_BASE_URL: ${{ vars.AUDIO_PUBLIC_BASE_URL }}
    steps:
      - name: Choose stage
        id: stage
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "stage=${{ inputs.stage }}" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          schedule="${{ github.event.schedule }}"
          case "$schedule" in
            "0 10 * * *"|"0 11 * * *")
              stage="primary"
              expected_time="03:00"
              ;;
            "15 10 * * *"|"15 11 * * *")
              stage="refresh"
              expected_time="03:15"
              ;;
            *)
              stage="publish"
              expected_time="03:30"
              ;;
          esac

          local_time="$(TZ=America/Los_Angeles date +%H:%M)"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          if [[ "$local_time" == "$expected_time" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping inactive UTC candidate; Pacific time is $local_time."
          fi

      - uses: actions/checkout@v4
        if: steps.stage.outputs.should_run == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.stage.outputs.should_run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Generate publication artifacts
        if: steps.stage.outputs.should_run == 'true'
        run: node scripts/run-radio-pipeline.mjs --stage=${{ steps.stage.outputs.stage }}

      - name: Validate generated data
        if: steps.stage.outputs.should_run == 'true'
        run: node --test tests/pipeline.test.mjs

      - name: Commit publication update
        if: steps.stage.outputs.should_run == 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No publication changes"
            exit 0
          fi
          git config user.name "sharecapsule-radio-bot"
          git config user.email "radio-bot@users.noreply.github.com"
          git add data public/feed.xml
          git commit -m "publish: update U.S. morning radio briefing"
          git push
