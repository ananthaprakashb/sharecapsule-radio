name: Radio publication

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST next day: primary collection
    - cron: "15 0 * * *"  # 05:45 IST: Asia refresh and publication preparation
  workflow_dispatch:
    inputs:
      stage:
        description: Pipeline stage
        required: true
        default: all
        type: choice
        options: [primary, refresh, publish, all]

permissions:
  contents: write

concurrency:
  group: sharecapsule-radio-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RADIO_MODE: ${{ vars.RADIO_MODE || 'mock' }}
      PUBLICATION_BASE_URL: https://radio.sharecapsule.app
      MARKET_DATA_URL: ${{ vars.MARKET_DATA_URL }}
      NEWS_FEED_URL: ${{ vars.NEWS_FEED_URL }}
      MARKET_DATA_TOKEN: ${{ secrets.MARKET_DATA_TOKEN }}
      NEWS_FEED_TOKEN: ${{ secrets.NEWS_FEED_TOKEN }}
      SCRIPT_GENERATOR_URL: ${{ vars.SCRIPT_GENERATOR_URL }}
      SCRIPT_GENERATOR_TOKEN: ${{ secrets.SCRIPT_GENERATOR_TOKEN }}
      TTS_URL: ${{ vars.TTS_URL }}
      TTS_TOKEN: ${{ secrets.TTS_TOKEN }}
      AUDIO_PUBLIC_BASE_URL: ${{ vars.AUDIO_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Choose stage
        id: stage
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            stage="${{ inputs.stage }}"
          elif [[ "${{ github.event.schedule }}" == "30 21 * * *" ]]; then
            stage="primary"
          else
            stage="all"
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Generate publication artifacts
        run: node scripts/run-radio-pipeline.mjs --stage=${{ steps.stage.outputs.stage }}

      - name: Validate generated data
        run: node --test tests/pipeline.test.mjs

      - name: Commit publication update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No publication changes"
            exit 0
          fi
          git config user.name "sharecapsule-radio-bot"
          git config user.email "radio-bot@users.noreply.github.com"
          git add data public/feed.xml
          git commit -m "publish: update morning radio briefing"
          git push
